/* 新しい版が出ていたら自動で読み直す（ホーム画面のアイコンが古い画面を覚えたままにならないように） */
(function(){
  var MY = window.__tbVer, K = '__tb' + 'Ver = ' + String.fromCharCode(34);
  function busy(){ var a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
  function check(){
    if (busy()) return;
    fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.text(); }).then(function(t){
      var i = t.indexOf(K); if (i < 0) return;
      var v = t.slice(i + K.length, t.indexOf(String.fromCharCode(34), i + K.length));
      if (!v || v === MY) return;
      try { if (sessionStorage.getItem("tb-up-" + v)) return; sessionStorage.setItem("tb-up-" + v, "1"); } catch (e) {}
      location.replace(location.pathname + "?v=" + v);
    }).catch(function(){});
  }
  check();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) check(); });
})();
</script>

/* ── Firebase（集計表と同じプロジェクト）につなぐ窓口。ボードのデータは tb_ で始まる場所に置く ── */
(function(){
  var CFG = {
    apiKey: "AIzaSyB5r7pjt6kHVzQ7NKiQ1wBQxp74j_I4wt0",
    authDomain: "tokuwa-apps.firebaseapp.com",
    projectId: "tokuwa-apps",
    storageBucket: "tokuwa-apps.firebasestorage.app",
    messagingSenderId: "839555718133",
    appId: "1:839555718133:web:678fb31e9b6a036fc59ebc"
  };
  var app = firebase.initializeApp(CFG, "tokuwa-board");
  var fs = firebase.firestore(app);
  try { fs.settings({ ignoreUndefinedProperties: true, merge: true }); } catch (e) {}
  try { fs.enablePersistence({ synchronizeTabs: true }).catch(function(){}); } catch (e) {}
  var auth = firebase.auth(app);
  var PRE = "tb_";
  function pre(p){ var i = p.indexOf("/"); return i < 0 ? PRE + p : PRE + p.slice(0, i) + p.slice(i); }
  var dbApi = { collection: function(p){ return fs.collection(pre(p)); }, doc: function(p){ return fs.doc(pre(p)); } };
  /* 写真は端末で縮めてから保存（長い辺1000px） */
  function shrink(file, max, q){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w*s); c.height = Math.round(h*s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej({ code:"unsupported_type" }); };
      img.src = url;
    });
  }
  var assetsApi = {
    upload: function(file){
      if (!file || !/^image\//.test(file.type)) return Promise.reject({ code:"unsupported_type" });
      return shrink(file, 1000, 0.55).then(function(url){
        return { id: "img" + Date.now().toString(36), url: url, contentType: "image/jpeg", sizeBytes: Math.round(url.length * 0.75) };
      });
    }
  };
  var userApi = {
    id: function(){ return Promise.resolve(auth.currentUser ? auth.currentUser.uid : null); },
    can: function(){ return Promise.resolve(true); },
    canEdit: function(){ return Promise.resolve(true); },
    isOwner: function(){ return Promise.resolve(true); },
    me: function(){ var u = auth.currentUser || {}; return Promise.resolve({ id: u.uid, name: u.email || "" }); },
    profiles: function(){ return Promise.resolve({}); }
  };
  window.__tbHost = "github";
  window.claude = { use: function(n){ return Promise.resolve(n === "db" ? dbApi : n === "assets" ? assetsApi : n === "user" ? userApi : null); } };
  window.__tbIdToken = function(){ return auth.currentUser ? auth.currentUser.getIdToken() : Promise.reject(new Error("ログインしていません")); };
  window.__tbSignOut = function(){ auth.signOut().then(function(){ location.reload(); }); };
  var started = false, login = document.getElementById("tb-login"), boot = document.getElementById("tb-boot");
  auth.onAuthStateChanged(function(u){
    boot.hidden = true; boot.style.display = "none";
    if (u) {
      window.__tbEmail = u.email || "";
      login.hidden = true;
      if (!started) { started = true; if (window.__tbStart) window.__tbStart(); else window.__tbPending = true; }
    } else {
      login.hidden = false;
    }
  });
  document.getElementById("tb-form").addEventListener("submit", function(e){
    e.preventDefault();
    var btn = document.getElementById("tb-btn"), err = document.getElementById("tb-err");
    btn.disabled = true; err.textContent = "";
    auth.signInWithEmailAndPassword(document.getElementById("tb-email").value.trim(), document.getElementById("tb-pass").value)
      .catch(function(x){
        var c = x && x.code || "";
        err.textContent = /invalid|wrong-password|user-not-found/.test(c) ? "パスワードが違います"
          : c === "auth/too-many-requests" ? "失敗が続いたので少し待ってからお試しください"
          : c === "auth/network-request-failed" ? "インターネットにつながっていません" : "ログインできませんでした（" + c + "）";
      })
      .then(function(){ btn.disabled = false; });
  });
})();
</script>
