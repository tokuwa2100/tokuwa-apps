<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a4f9c">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="引張試験">
<title>あと施工アンカー引張試験報告書 作成ツール</title>
<style>
  :root{
    --navy:#1f3a5f;
    --navy-d:#15293f;
    --line:#333;
    --bg:#eceff3;
    --panel:#ffffff;
    --muted:#5a6573;
    --ok:#1d7a3a;
    --ng:#c0392b;
    --field:#f6f8fa;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Yu Gothic","游ゴシック","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    background:var(--bg);
    color:#1a1a1a;
    font-size:14px;
    line-height:1.6;
  }
  /* ===== レイアウト ===== */
  .app{display:flex;gap:0;min-height:100vh;}
  .controls{
    width:46%;
    max-width:680px;
    min-width:380px;
    padding:20px 22px 80px;
    background:var(--panel);
    border-right:2px solid #d3d8de;
    overflow-y:auto;
    height:100vh;
  }
  .preview-wrap{
    flex:1;
    padding:24px;
    overflow-y:auto;
    height:100vh;
  }
  .topbar{
    position:sticky;top:0;z-index:5;
    background:var(--navy);
    color:#fff;
    margin:-20px -22px 18px;
    padding:14px 22px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;}
  .topbar .sub{font-size:11px;opacity:.8;display:block;font-weight:400;}
  .btn{
    font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
    border:none;border-radius:6px;padding:9px 16px;transition:.15s;
  }
  .btn-print{background:#fff;color:var(--navy);}
  .btn-print:hover{background:#e8eef5;}
  .btn-add{background:var(--navy);color:#fff;padding:8px 14px;font-size:13px;}
  .btn-add:hover{background:var(--navy-d);}
  .btn-del{background:#f1d6d3;color:var(--ng);padding:4px 9px;font-size:12px;border-radius:5px;}
  .btn-del:hover{background:#e8b9b4;}
  .btn-ghost{background:#eef1f5;color:var(--navy);font-size:12px;padding:6px 12px;}
  .btn-ghost:hover{background:#dfe5ec;}
  .seg{display:inline-flex;border:1px solid #c7ced6;border-radius:6px;overflow:hidden;}
  .seg-btn{font-family:inherit;font-size:13px;font-weight:700;padding:7px 16px;border:none;background:#fff;color:var(--muted);cursor:pointer;}
  .seg-btn+.seg-btn{border-left:1px solid #c7ced6;}
  .seg-btn.active{background:var(--navy);color:#fff;}
  input.ro{background:#eceff2 !important;color:#777;}

  details.group{
    border:1px solid #d8dde3;border-radius:8px;margin-bottom:14px;overflow:hidden;
  }
  details.group>summary{
    background:var(--field);padding:11px 14px;font-weight:700;color:var(--navy);
    cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;user-select:none;
  }
  details.group>summary::-webkit-details-marker{display:none;}
  details.group>summary::before{content:"▸";font-size:12px;transition:.15s;color:var(--muted);}
  details.group[open]>summary::before{transform:rotate(90deg);}
  .group-body{padding:14px;}
  .hint{font-size:11px;color:var(--muted);font-weight:400;margin-left:auto;}

  .field{margin-bottom:11px;}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px;}
  .field input[type=text],.field input[type=date],.field textarea,.field input[type=number],.field select{
    width:100%;font-family:inherit;font-size:13px;padding:7px 9px;
    border:1px solid #c7ced6;border-radius:5px;background:var(--field);color:#1a1a1a;
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--navy);outline-offset:-1px;background:#fff;}
  .ig{display:flex;align-items:stretch;border:1px solid #c7ced6;border-radius:5px;overflow:hidden;background:var(--field);}
  .ig:focus-within{outline:2px solid var(--navy);outline-offset:-1px;}
  .ig input{border:none !important;border-radius:0;background:transparent;flex:1;min-width:0;}
  .ig input:focus{outline:none;background:transparent;}
  .ig .ig-pre,.ig .ig-suf{display:flex;align-items:center;padding:0 9px;background:#e3e8ee;color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;}
  .field textarea{resize:vertical;min-height:46px;line-height:1.5;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ===== 試験結果 入力テーブル ===== */
  .anchor-card{
    border:1px solid #d2d8df;border-radius:8px;padding:12px;margin-bottom:12px;background:#fcfdfe;
  }
  .anchor-card .ac-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .anchor-card .ac-no{font-weight:800;color:var(--navy);font-size:15px;}
  .ac-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .ac-grid .field{margin-bottom:0;}
  .judge{font-weight:800;font-size:13px;padding:3px 10px;border-radius:14px;display:inline-block;}
  .judge.ok{background:#dff3e4;color:var(--ok);}
  .judge.ng{background:#fae0dc;color:var(--ng);}
  .judge.na{background:#eceff2;color:var(--muted);}

  .photo-cell{margin-top:2px;}
  .photo-cell label.flabel{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px;}
  .photo-drop{
    border:1.5px dashed #b9c2cc;border-radius:6px;background:#f6f8fa;
    min-height:64px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:11px;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;
  }
  .photo-drop:hover{border-color:var(--navy);background:#eef3f8;}
  .photo-drop img{width:100%;height:100%;max-height:110px;object-fit:cover;display:block;}
  .photo-drop .clearx{
    position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;
    width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;
  }
  .photos2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px;}

  .toolbar-results{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}

  /* ===== 報告書プレビュー ===== */
  .report{
    background:#fff;width:210mm;margin:0 auto;
    box-shadow:0 3px 18px rgba(0,0,0,.18);
    color:#000;
    font-family:"Yu Gothic","游ゴシック","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  }
  .page{
    width:210mm;min-height:297mm;padding:18mm 16mm;
    page-break-after:always;position:relative;
  }
  .page:last-child{page-break-after:auto;}

  /* 表紙 */
  .cover{display:flex;flex-direction:column;}
  .cover .cv-proj{font-size:15px;text-align:center;margin-top:30mm;letter-spacing:.04em;}
  .cover .cv-title{
    font-size:30px;font-weight:800;text-align:center;letter-spacing:.5em;
    margin:24mm 0 4mm;padding-left:.5em;
  }
  .cover .cv-rule{width:60%;margin:0 auto;border-bottom:2px solid #000;}
  .cover .cv-sub{font-size:16px;text-align:center;margin-top:6mm;letter-spacing:.1em;}
  .cover .cv-foot{margin-top:auto;margin-bottom:28mm;text-align:center;font-size:15px;letter-spacing:.05em;}
  .cover .cv-foot .lbl{font-size:12px;color:#444;letter-spacing:.05em;}
  .cover .cv-company{position:relative;display:inline-block;}
  .cover .cv-stamp{position:absolute;right:-13mm;top:-4mm;width:23mm;height:23mm;object-fit:contain;}
  .qual-img{margin-top:6px;}
  .qual-img img{max-height:38mm;max-width:100%;border:1px solid #999;display:block;}
  .equip-img{margin-top:8px;text-align:center;}
  .equip-img img{max-height:58mm;max-width:100%;border:1px solid #999;}

  .sec{margin-bottom:9px;}
  .sec-h{
    font-weight:800;font-size:14px;background:#1f3a5f;color:#fff;
    padding:3px 10px;margin-bottom:6px;letter-spacing:.06em;
  }
  table.rt{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.rt th,table.rt td{border:1px solid #000;padding:4px 8px;vertical-align:middle;}
  table.rt th{background:#eef1f5;font-weight:700;text-align:center;white-space:nowrap;width:32%;}
  table.rt td{text-align:left;}
  .proc-list{margin:0;padding-left:1.4em;font-size:12.5px;}
  .proc-list li{margin-bottom:2px;}
  .purpose{font-size:12.5px;margin:0 0 4px;}

  .rep-head{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid #000;padding-bottom:5px;margin-bottom:12px;}
  .rep-head .rh-title{font-size:17px;font-weight:800;letter-spacing:.08em;}
  .rep-head .rh-proj{font-size:11px;color:#333;}

  /* 結果ブロック */
  .res-block{border:1px solid #000;margin-bottom:6px;page-break-inside:avoid;break-inside:avoid;}
  .res-block .rb-no{background:#1f3a5f;color:#fff;font-weight:800;font-size:14px;padding:3px 10px;}
  table.res{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.res th,table.res td{border:1px solid #000;padding:3px 8px;}
  table.res th{background:#eef1f5;width:18%;text-align:center;white-space:nowrap;}
  table.res td{text-align:center;width:32%;}
  table.res td.judge-cell{font-weight:800;}
  .judge-cell.ok{color:var(--ok);}
  .judge-cell.ng{color:var(--ng);}
  .res-photos{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #000;}
  .res-photos .rp{padding:4px;border-right:1px solid #000;text-align:center;}
  .res-photos .rp:last-child{border-right:none;}
  .res-photos .rp-cap{font-size:11px;font-weight:700;margin-bottom:3px;}
  .res-photos .rp-img{
    height:36mm;border:1px solid #999;display:flex;align-items:center;justify-content:center;
    background:#fafafa;color:#aaa;font-size:11px;overflow:hidden;
  }
  .res-photos .rp-img img{width:100%;height:100%;object-fit:contain;}

  .pg-num{position:absolute;bottom:8mm;left:0;right:0;text-align:center;font-size:10px;color:#666;}

  @media (max-width:1100px){
    .app{flex-direction:column;}
    .controls{width:100%;max-width:none;height:auto;border-right:none;border-bottom:2px solid #d3d8de;}
    .preview-wrap{height:auto;}
    .report{transform:scale(.62);transform-origin:top center;}
  }

  /* ===== 印刷（PDF） ===== */
  @page{size:A4;margin:0;}
  .ver{text-align:right;font-size:11px;line-height:1.4;color:#777;white-space:nowrap;font-variant-numeric:tabular-nums;margin-right:4px}
  .ver b{display:block;font-size:13px;color:#333;font-weight:800}
  .ver span{display:block}
  @media print{
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
    body{background:#fff;}
    .controls,.topbar,.noprint,#importInfo{display:none !important;}
    .app{display:block;}
    .preview-wrap{padding:0;height:auto;overflow:visible;}
    .report{box-shadow:none;width:auto;margin:0;transform:none;}
    .page{width:210mm;min-height:296mm;padding:15mm 14mm;margin:0;page-break-after:always;}
    .page:last-child{page-break-after:auto;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ================= 入力パネル ================= -->
  <div class="controls">
    <div class="topbar">
      <h1>引張試験報告書 作成ツール<span class="sub">あと施工アンカー / 株式会社徳和工業</span></h1>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="ver" id="verBadge"></div>
        <button class="btn btn-add" id="importBtn">日報データを読み込む</button>
        <button class="btn btn-print" onclick="window.print()">PDFで保存</button>
      </div>
    </div>
    <div id="updateBar" class="noprint" style="display:none;background:#fff3e0;border:1px solid #ef6c00;border-radius:10px;padding:14px 16px;margin:0 0 12px;">
      <div style="font-weight:800;color:#e65100;font-size:16px;">🔔 新しいバージョン <span id="updateVer"></span> があります</div>
      <div id="updateNote" style="font-size:13px;color:#555;margin-top:4px;line-height:1.5"></div>
      <button id="btnUpdate" style="margin-top:10px;padding:12px 18px;font-size:16px;font-weight:800;border:0;border-radius:10px;background:#ef6c00;color:#fff;">最新版に更新する</button>
    </div>
    <div id="importInfo" style="display:none;margin:0 0 10px;padding:8px 10px;border-radius:8px;background:#e8f5e9;color:#1b5e20;font-size:13px;font-weight:700;"></div>

    <details class="group" open>
      <summary>基本情報 <span class="hint">表紙・概要に反映</span></summary>
      <div class="group-body">
        <div class="field"><label>工事名</label><input type="text" id="f_proj" value=""></div>
        <div class="field"><label>報告書タイトル</label><input type="text" id="f_title" value="引張試験報告書"></div>
        <div class="field"><label>試験実施会社</label><input type="text" id="f_company" value="株式会社徳和工業"></div>
        <div class="row2">
          <div class="field"><label>試験日（表示用）</label><input type="text" id="f_testdate" value="2026年1月19日"></div>
          <div class="field"><label>試験場所</label><input type="text" id="f_place" value=""></div>
        </div>
        <div class="field"><label>施工士 氏名</label>
          <select id="f_engineer">
            <option value="松沢　俊宏">松沢　俊宏</option>
            <option value="渡部　徳史">渡部　徳史</option>
          </select>
        </div>
        <div class="row2">
          <div class="field"><label>施工士 資格名</label><input type="text" id="f_qual" value="あと施工アンカー第１種施工士"></div>
          <div class="field"><label>登録番号（自動）</label><input type="text" id="f_regno" value="1602031" readonly class="ro"></div>
        </div>
      </div>
    </details>

    <details class="group" open>
      <summary>角印・資格証 <span class="hint">画像を貼付</span></summary>
      <div class="group-body">
        <div class="photos2">
          <div class="photo-cell">
            <label class="flabel">会社角印（透過PNG推奨）</label>
            <div class="photo-drop" id="drop_stamp">＋ クリックで画像を選択</div>
          </div>
          <div class="photo-cell">
            <label class="flabel">施工士 資格証</label>
            <div class="photo-drop" id="drop_qual">＋ クリックで画像を選択</div>
          </div>
        </div>
      </div>
    </details>

    <details class="group" open>
      <summary>使用アンカー詳細</summary>
      <div class="group-body">
        <div class="field"><label>アンカーの分類</label><input type="text" id="f_acls" value="接着系カプセル型　旭化成　ARケミカルセッター　AP-20"></div>
        <div class="field"><label>アンカーの種類</label><input type="text" id="f_atype" value="全ネジボルト　M20"></div>
      </div>
    </details>

    <details class="group">
      <summary>施工条件・使用機械</summary>
      <div class="group-body">
        <div class="field"><label>施工使用機械</label><input type="text" id="f_machine" value="ハンマードリル　コンクリートビット　バキュームクリーナー"></div>
        <div class="field" style="margin-bottom:6px;"><label>施工条件（穿孔径・穿孔長・施工方向）<span class="hint">サイズごとに追加可</span></label></div>
        <div id="condList"></div>
        <button class="btn btn-add" id="addCondBtn">＋ 施工条件を追加</button>
      </div>
    </details>

    <details class="group">
      <summary>使用機材（試験機）<span class="hint">選択で一括切替</span></summary>
      <div class="group-body">
        <div class="field"><label>試験機の選択</label>
          <select id="f_eq_machine">
            <option value="AT-10DⅡ">AT-10DⅡ（100kN）</option>
            <option value="KT-20">KT-20（20kN）</option>
            <option value="AT-200">AT-200（200kN）</option>
          </select>
        </div>
        <div class="row2">
          <div class="field"><label>形式</label><input type="text" id="f_eq_model" value="AT-10DⅡ"></div>
          <div class="field"><label>最大荷重</label><input type="text" id="f_eq_maxload" value="100kN"></div>
        </div>
        <div class="row2">
          <div class="field"><label>最大変位量</label><input type="text" id="f_eq_maxdisp" value="15mm"></div>
          <div class="field"><label>測定範囲</label><input type="text" id="f_eq_range" value="荷重：0～100kN"></div>
        </div>
        <div class="row2">
          <div class="field"><label>最小表示値</label><input type="text" id="f_eq_min" value="荷重：0.1kN"></div>
          <div class="field"><label id="lbl_eq_sensor">荷重センサ</label><input type="text" id="f_eq_sensor" value="ポテンショメーター式"></div>
        </div>
        <div class="field"><label>負荷方式</label><input type="text" id="f_eq_load" value="リニア・スライド・ロード機構内臓ねじ締め式"></div>
        <div class="field"><label>センターシャフト</label><input type="text" id="f_eq_shaft" value="M20並目ボルト：全長260mm"></div>
        <div class="photo-cell" style="margin-top:6px;">
          <label class="flabel">試験機の写真</label>
          <div class="photo-drop" id="drop_equip">＋ クリックで画像を選択</div>
        </div>
      </div>
    </details>

    <details class="group" open>
      <summary>試験結果 <span class="hint">№ごとに入力・写真2枚</span></summary>
      <div class="group-body">
        <div class="field" style="margin-bottom:10px;">
          <label>指定荷重・アンカー種類の入力方法</label>
          <div class="seg" id="designSeg">
            <button type="button" class="seg-btn active" data-mode="common">共通（一括）</button>
            <button type="button" class="seg-btn" data-mode="indiv">個別（№ごと入力）</button>
          </div>
        </div>
        <div class="toolbar-results" id="commonRow">
          <div class="field" style="margin:0;flex:1;min-width:120px;">
            <label>共通：指定荷重値(kN)</label><input type="number" step="0.1" id="f_common_design" value="57.5">
          </div>
          <div class="field" style="margin:0;flex:1;min-width:120px;">
            <label>共通：アンカー種類</label><input type="text" id="f_common_type" value="M20">
          </div>
        </div>
        <div id="indivNote" class="hint" style="display:none;margin:0 0 10px;">サイズ別の場合は、各№の欄に指定荷重値・アンカー種類を入力してください。</div>
        <div id="anchorList"></div>
        <button class="btn btn-add" id="addBtn">＋ №を追加</button>
      </div>
    </details>

    <details class="group" open>
      <summary>考察</summary>
      <div class="group-body">
        <div class="field"><label>考察文</label><textarea id="f_consider" rows="4">試験結果の通り適切に施工されており、試験時及び試験後においてアンカー及び躯体に異常が認められず、基準に対して満足する引張強度を有していることが確認できる。</textarea></div>
      </div>
    </details>
  </div>

  <!-- ================= プレビュー ================= -->
  <div class="preview-wrap">
    <div class="report" id="report"></div>
  </div>
</div>

<script>
/* ---------- 状態 ---------- */
let anchors = [
  {date:"2026年1月19日", type:"M20", design:"57.5", measured:"57.6", overall:null, value:null},
  {date:"2026年1月19日", type:"M20", design:"57.5", measured:"57.6", overall:null, value:null},

/* ---------- 判定 ---------- */
function judge(design, measured){
  const d = parseFloat(design), m = parseFloat(measured);
  if(isNaN(d) || isNaN(m) || measured==="" ) return {cls:"na", text:"—"};
  return m >= d ? {cls:"ok", text:"合格"} : {cls:"ng", text:"不合格"};
}

/* ---------- 入力パネル：試験結果カード描画 ---------- */
function renderAnchorInputs(){
  const list = $("anchorList");
  list.innerHTML = "";
  anchors.forEach((a, i) => {
    const card = document.createElement("div");
    card.className = "anchor-card";
    const j = judge(a.design, a.measured);
    card.innerHTML = `
      <div class="ac-head">
        <span class="ac-no">№${i+1}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="judge ${j.cls}">${j.text}</span>
          <button class="btn btn-del" data-del="${i}">削除</button>
        </div>
      </div>
      <div class="ac-grid">
        <div class="field"><label>実施日（自動）</label><input type="text" data-f="date" data-i="${i}" value="${esc(a.date)}" readonly class="ro"></div>
        <div class="field"><label>アンカー種類</label><input type="text" data-f="type" data-i="${i}" value="${esc(a.type)}" ${designMode==='common'?'readonly class="ro"':''}></div>
        <div class="field"><label>指定荷重値(kN)</label><input type="number" step="0.1" data-f="design" data-i="${i}" value="${esc(a.design)}" ${designMode==='common'?'readonly class="ro"':''}></div>
        <div class="field"><label>実施荷重値(kN)</label><input type="number" step="0.1" data-f="measured" data-i="${i}" value="${esc(a.measured)}"></div>
      </div>
      <div class="photos2">
        <div class="photo-cell">
          <label class="flabel">全体写真</label>
          <div class="photo-drop" data-ph="overall" data-i="${i}">${photoInner(a.overall)}</div>
        </div>
        <div class="photo-cell">
          <label class="flabel">数値写真</label>
          <div class="photo-drop" data-ph="value" data-i="${i}">${photoInner(a.value)}</div>
        </div>
      </div>`;
    list.appendChild(card);
  });
  attachAnchorHandlers();
}

function photoInner(data){
  if(data){
    return `<img src="${data}"><button class="clearx" type="button">×</button>`;
  }
  return `＋ クリックで画像を選択`;
}

function attachAnchorHandlers(){
  document.querySelectorAll('[data-f]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.i, f = e.target.dataset.f;
      anchors[i][f] = e.target.value;
      // 判定バッジだけ更新
      const j = judge(anchors[i].design, anchors[i].measured);
      const badge = e.target.closest('.anchor-card').querySelector('.judge');
      badge.className = "judge " + j.cls; badge.textContent = j.text;
      renderReport();
    });
  });
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', e=>{
      anchors.splice(+e.target.dataset.del,1);
      renderAnchorInputs(); renderReport();
    });
  });
  document.querySelectorAll('.photo-drop').forEach(drop=>{
    const i = +drop.dataset.i, ph = drop.dataset.ph;
    const clearBtn = drop.querySelector('.clearx');
    if(clearBtn){
      clearBtn.addEventListener('click', e=>{
        e.stopPropagation();
        anchors[i][ph] = null;
        drop.innerHTML = photoInner(null);
        reattachOne(drop);
        renderReport();
      });
    }
    drop.addEventListener('click', ()=>pickImage(i, ph, drop));
  });
}
function reattachOne(drop){
  const i = +drop.dataset.i, ph = drop.dataset.ph;
  const clearBtn = drop.querySelector('.clearx');
  if(clearBtn){
    clearBtn.addEventListener('click', e=>{
      e.stopPropagation(); anchors[i][ph]=null; drop.innerHTML=photoInner(null); reattachOne(drop); renderReport();
    });
  }
}

function pickImage(i, ph, drop){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const file = inp.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      anchors[i][ph] = downscale(reader.result, 1280, (out)=>{
        anchors[i][ph] = out;
        drop.innerHTML = photoInner(out);
        reattachOne(drop);
        renderReport();
      });
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

/* 画像を縮小してファイルサイズを抑える */
function downscale(dataUrl, maxW, cb){
  const img = new Image();
  img.onload = () => {
    let w = img.width, h = img.height;
    if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg', 0.82));
  };
  img.onerror = ()=>cb(dataUrl);
  img.src = dataUrl;
}

            <th>判定</th><td colspan="3" class="judge-cell ${j.cls}">${j.text}${j.cls==="ok"?"（指定荷重以上）":j.cls==="ng"?"（指定荷重未満）":""}</td>
          </tr>
        </table>
        <div class="res-photos">
          <div class="rp"><div class="rp-cap">全体写真</div><div class="rp-img">${a.overall?`<img src="${a.overall}">`:"写真貼付"}</div></div>
          <div class="rp"><div class="rp-cap">数値写真</div><div class="rp-img">${a.value?`<img src="${a.value}">`:"写真貼付"}</div></div>
        </div>
      </div>`;
    }
    html += `<div class="pg-num">${PN()}</div></div>`;
  }

  // 考察ページ
  html += `
  <div class="page">
    <div class="rep-head"><div class="rh-title">考 察</div><div class="rh-proj">${proj}</div></div>
    <div class="sec">
      <div class="sec-h">考察</div>
      <p class="purpose" style="line-height:1.9;">${esc(val("f_consider")).replace(/\n/g,"<br>")}</p>
    </div>
    <div class="pg-num">${PN()}</div>
  </div>`;

  $("report").innerHTML = html;
}

/* ---------- 角印・資格証アップロード（単一画像） ---------- */
function initSingleDrop(dropId, getFn, setFn){
  const drop = $(dropId);
  function refresh(){
    const d = getFn();
    drop.innerHTML = d ? `<img src="${d}"><button class="clearx" type="button">×</button>` : `＋ クリックで画像を選択`;
  }
  refresh();
  drop.addEventListener('click', e=>{
    if(e.target.classList.contains('clearx')){ e.stopPropagation(); setFn(null); refresh(); renderReport(); return; }
    const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange = ()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
      r.onload = ()=>downscale(r.result, 1280, out=>{ setFn(out); refresh(); renderReport(); });
      r.readAsDataURL(f); };
    inp.click();
  });
  return refresh;
}

/* ---------- 施工条件セット（穿孔径・穿孔長・施工方向） ---------- */
function dirOptions(sel){
  const opts = [
    {v:"下横向き　施工躯体面に対して直角", t:"下横向き"},
    {v:"上向き　施工躯体面に対して直角", t:"上向き"}
  ];
  return opts.map(o=>`<option value="${esc(o.v)}" ${o.v===sel?'selected':''}>${o.t}</option>`).join("");
}
function renderConditions(){
  const list = $("condList");
  list.innerHTML = "";
  conditions.forEach((c,i)=>{
    const card = document.createElement("div");
    card.className = "anchor-card";
    card.innerHTML = `
      <div class="ac-head">
        <span class="ac-no">条件${i+1}</span>
        ${conditions.length>1?`<button class="btn btn-del" data-delcond="${i}">削除</button>`:''}
      </div>
      <div class="field"><label>種類・呼称（任意）</label><input type="text" data-cf="label" data-ci="${i}" value="${esc(c.label||'')}" placeholder="例：M16, D13"></div>
      <div class="row2">
        <div class="field"><label>穿孔径</label>
          <div class="ig"><span class="ig-pre">φ</span><input type="number" step="0.1" data-cf="dia" data-ci="${i}" value="${esc(c.dia)}"><span class="ig-suf">㎜</span></div>
        </div>
        <div class="field"><label>穿孔長（埋込深さ）</label>
          <div class="ig"><span class="ig-pre">L＝</span><input type="number" step="1" data-cf="depth" data-ci="${i}" value="${esc(c.depth)}"><span class="ig-suf">㎜</span></div>
        </div>
      </div>
      <div class="field"><label>施工方向</label>
        <select data-cf="dir" data-ci="${i}">${dirOptions(c.dir)}</select>
      </div>`;
    list.appendChild(card);
  });
  list.querySelectorAll('[data-cf]').forEach(inp=>{
    const ev = inp.tagName === 'SELECT' ? 'change' : 'input';
    inp.addEventListener(ev, e=>{
      conditions[+e.target.dataset.ci][e.target.dataset.cf] = e.target.value;
      renderReport();
    });
  });
  list.querySelectorAll('[data-delcond]').forEach(b=>{
    b.addEventListener('click', e=>{
      conditions.splice(+e.target.dataset.delcond,1);
      renderConditions(); renderReport();
    });
  });
}

});


/* =============================
  アプリのバージョン
  ★ 更新したら この3行 と version.json を書き換える
============================= */
const APP_KEY       = "hikihari";
const APP_VERSION   = "1.0.0";
const APP_BUILD     = "2026-11-23";

(function(){
  const b = document.getElementById("verBadge");
  if(b) b.innerHTML = `<b>v${APP_VERSION}</b>${APP_BUILD}`;
  checkLatestVersion();
})();

async function fetchVersionJson(){
  for(const path of ["version.json", "../version.json"]){
    try{
      const res = await fetch(path + "?_=" + Date.now(), { cache:"no-store" });
      if(res.ok) return await res.json();
    }catch(e){ /* 次を試す */ }
  }
  return null;
}
async function checkLatestVersion(){
  const badge = document.getElementById("verBadge");
  if(!navigator.onLine) return;
  const all = await fetchVersionJson();
  if(!all) return;
  const info = all[APP_KEY];
  if(!info || !info.version) return;
  if(info.version === APP_VERSION){
    if(badge) badge.innerHTML = `<b>v${APP_VERSION}</b><span style="color:#2e7d32;font-weight:700">✓ 最新です</span>`;
  }else{
    if(badge) badge.innerHTML = `<b style="color:#c62828">v${APP_VERSION}</b><span style="color:#c62828;font-weight:700">更新あり</span>`;
    const bar = document.getElementById("updateBar");
    if(!bar) return;
    document.getElementById("updateVer").textContent  = "v" + info.version;
    document.getElementById("updateNote").textContent = info.note || "";
    bar.style.display = "block";
    document.getElementById("btnUpdate").onclick = () => {
      if(!confirm("最新版に更新します。\n入力途中の内容は消える場合があります。\n\nよろしいですか？")) return;
      location.replace(location.pathname + "?v=" + encodeURIComponent(info.version));
    };
  }
}

/* =============================
  アンカー日報そのもののデータ（ドライブに保存されたJSON）を報告書の形に直す
============================= */
const NP_TESTERS = { "松沢": "松沢　俊宏", "渡部": "渡部　徳史" };
const NP_CLASS = {
  AP:    "接着系カプセル型　旭化成　ARケミカルセッター　AP",
  EA500: "接着系注入型　旭化成　ARケミカルセッター　EA-500",
  EL360: "接着系注入型　日本デコラックス　ケミチューブ　EL-360"
};
function npSizeKind(sz){
  const c = String(sz || "").charAt(0);
  if(c === "D") return "異形棒鋼";
  if(c === "W") return "全ネジボルト（インチ）";
  return "全ネジボルト";
}
function npDir(d){
  return d === "上" ? "上向き　施工躯体面に対して直角" : "下横向き　施工躯体面に対して直角";
}
function npClass(a){
  if(!a) return "";
  if(a.type === "METAL") return "金属系　打込み式" + (a.series ? "　" + a.series : "");
  if(a.type === "OTHER") return a.typeOther || "";
  return NP_CLASS[a.type] || "";
}
function npDateKanji(iso){
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[1]}年${Number(m[2])}月${Number(m[3])}日` : (iso || "");
}
function nippoRecordToReport(r){
  const tt = r.test || { rows: [] };
  const rows = (tt.rows || []).filter(x => x && (x.measured != null || x.size));
  const list = [];
  (r.workers || []).forEach(w => (w.anchors || []).forEach(a => list.push(a)));

  const conditions = [], seen = new Set();
  const put = (sz, a) => {
    if(!sz || seen.has(sz)) return;
    seen.add(sz);
    conditions.push({
      label: sz,
      dia:   (a && a.dia != null) ? String(a.dia) : "",
      depth: (a && a.emb != null) ? String(a.emb) : "",
      dir:   npDir(a ? a.dir : "")
    });
  };
  rows.forEach(t => put(t.size, list.filter(x => x.size === t.size)[0]));
  list.forEach(a => put(a.size, a));

  const firstTested = rows.length ? list.filter(x => x.size === rows[0].size)[0] : null;
  const first = firstTested || list[0] || null;
  const mainSize = (rows[0] && rows[0].size) ? rows[0].size : (first ? first.size : "");
  const jp = npDateKanji(r.date);
  const designs = [...new Set(rows.map(t => t.design))];

  return {
    format: "TOKUWA_ANCHOR_TEST", ver: 2,
    date: r.date || "", client: r.client || "", project: r.project || "",
    place: (tt.place || r.site || ""), testdate: jp, machine: tt.machine || "",
    engineer: NP_TESTERS[tt.tester] || tt.tester || "",
    anchorClass: npClass(first),
    anchorType: mainSize ? (npSizeKind(mainSize) + "　" + mainSize) : "",
    designCommon: (designs.length === 1 && designs[0] != null) ? String(designs[0]) : "",
    testTotal: rows.length,
    conditions: conditions,
    anchors: rows.map(t => ({
      date: jp, type: t.size || "",
      design:   t.design   != null ? String(t.design)   : "",
      measured: t.measured != null ? String(t.measured) : "",
      overall: null, value: null, memo: t.memo || ""
    }))
  };
}

/* ---------- アンカー日報の書き出しデータ（JSON）を読み込む ---------- */
function applyNippoJson(j){
  if(!j || j.format !== "TOKUWA_ANCHOR_TEST"){
    alert("アンカー日報から書き出したデータではないようです。");
    return;
  }
  if(j.project) $("f_proj").value = j.project;
  else if(j.place) $("f_proj").value = j.place;
  if(j.place)       $("f_place").value   = j.place;
  if(j.testdate)    $("f_testdate").value = j.testdate;
  if(j.anchorClass) $("f_acls").value    = j.anchorClass;
  if(j.anchorType)  $("f_atype").value   = j.anchorType;
  if(j.machine && MACHINES[j.machine]){
    $("f_eq_machine").value = j.machine;
    applyMachine(j.machine);
  }
  // 試験を行った施工士を自動で選ぶ（資格名・登録番号・資格証も切り替わる）
  let engNote = "";
  if(j.engineer){
    if(engineers[j.engineer]){
      $("f_engineer").value = j.engineer;
      $("f_qual").value  = engineers[j.engineer].qual;
      $("f_regno").value = engineers[j.engineer].regno;
    }else{
      engNote = "　※施工士「" + j.engineer + "」は未登録です。施工士を選び直してください";
    }
  }
  if(Array.isArray(j.conditions) && j.conditions.length){
    conditions = j.conditions.map(c=>({
      label: c.label || "",
      dia:   c.dia   || "",
      depth: c.depth || "",
      dir:   c.dir   || "下横向き　施工躯体面に対して直角"
    }));
  }
  const rows = Array.isArray(j.anchors) ? j.anchors : [];
  if(rows.length){
    anchors = rows.map(a=>({
      date:     a.date || j.testdate || "",
      type:     a.type || "",
      design:   a.design   != null ? String(a.design)   : "",
      measured: a.measured != null ? String(a.measured) : "",
      overall:  a.overall || null,
      value:    a.value   || null
    }));
    const ds = new Set(anchors.map(a=>a.design));
    const ts = new Set(anchors.map(a=>a.type));
    designMode = (ds.size === 1 && ts.size === 1) ? "common" : "indiv";
    if(j.designCommon && ds.size === 1) $("f_common_design").value = j.designCommon;
    if(designMode === "common"){
      $("f_common_design").value = anchors[0].design;
      $("f_common_type").value   = anchors[0].type;
    }
    document.querySelectorAll('#designSeg .seg-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.mode === designMode);
    });
    $("commonRow").style.display = designMode === 'common' ? '' : 'none';
    $("indivNote").style.display = designMode === 'common' ? 'none' : '';
  }
  renderConditions();
  renderAnchorInputs();
  renderReport();

  const box = $("importInfo");
  if(box){
    box.style.display = "block";
    box.textContent = "読み込みました：" + (j.place || "") + "（試験 " + rows.length + "本"
      + (j.engineer ? "／施工士 " + j.engineer : "") + "）"
      + (j.date ? "　作業日 " + j.date : "")
      + "　※写真を貼り、内容を確認してから「PDFで保存」してください。" + engNote;
  }
}
$("importBtn").addEventListener("click", ()=>{
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        let data = JSON.parse(r.result);
        // ドライブに保存された日報が配列で入っている場合は、試験の入った1件を選ぶ
        if(Array.isArray(data)){
          data = data.filter(x => x && x.test && x.test.on === true)[0] || data[0];
        }else if(data && Array.isArray(data.records)){
          data = data.records.filter(x => x && x.test && x.test.on === true)[0] || data.records[0];
        }
        if(!data) throw new Error("empty");
        if(data.format === "TOKUWA_ANCHOR_TEST"){
          applyNippoJson(data);                        // 日報アプリの「報告書用データ」
        }else if(data.app === "anchor-nippo" || data.type === "anchor" || data.test || data.workers){
          const conv = nippoRecordToReport(data);      // 日報そのもののデータ（ドライブ保存分）
          if(!conv.anchors.length){ alert("この日報には引張試験が入っていません。"); return; }
          applyNippoJson(conv);
        }else{
          alert("アンカー日報のデータではないようです。");
        }
      }catch(e){
        alert("ファイルを読み込めませんでした。アンカー日報で書き出したJSON、またはドライブに保存された日報のJSONを選んでください。");
      }
    };
    r.readAsText(f);
  };
  inp.click();
});

/* ---------- 初期描画 ---------- */
renderConditions();
renderAnchorInputs();
renderReport();
</script>
