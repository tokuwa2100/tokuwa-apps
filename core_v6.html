<style>

<body>
<div class="box">
  <h1>⚠️ コア日報のアプリは入れ直しが必要です</h1>
  <p>コア日報と常用日報が入れ替わってしまう問題を直すため、アプリの場所を変えました。<br>このアイコン（旧・コアアプリ）はもう使いません。</p>
  <ol>
    <li>下の緑のボタンで、新しいコア日報を開く</li>
    <li>Chromeの右上「︙」→「<b>アプリをインストール</b>」（または「ホーム画面に追加」）</li>
    <li>ホーム画面の<b>古い日報アイコンは長押しして削除</b>（アンインストール）</li>
  </ol>
  <a class="btn" href="https://tokuwa2100.github.io/tokuwa-apps/core/">新しいコア日報を開く</a>
  <div class="url">https://tokuwa2100.github.io/tokuwa-apps/core/</div>
  <p class="note">保存済み・未送信の日報は、そのまま新しいアプリに引き継がれます。</p>
